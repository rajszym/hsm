name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        defs: ["", "DEBUG", "CLANG", "CLANG DEBUG"]
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM tools
        if: contains(matrix.defs, 'CLANG')
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Build example
        run: make DEFS="${{ matrix.defs }}"
      - name: Run tests
        run: make DEFS="${{ matrix.defs }}" test
